<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merge Tower Defense</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
</head>
<body>
    <div id="app">
        <header>
            <button id="home-btn" title="Go to Main Menu">🏠</button>
            <div id="game-info">
                <div id="score-container">
                    Score: <span id="score">0</span>
                </div>
                <div id="wave-container">
                    Wave: <span id="wave">0</span>
                </div>
                <div id="lives-container">
                    Lives: <span id="lives">5</span>
                </div>
            </div>
            <div id="wave-controls">
                <button id="start-wave-btn">Start Wave</button>
                <div id="wave-timer">Next wave in: <span id="wave-countdown">30</span>s</div>
            </div>
        </header>
        <div id="title-screen" class="screen active">
            <h1 class="title-header">Merge Tower <input type="text" id="theme-input" placeholder="Defense..." autocomplete="off"></h1>
            <div class="difficulty-buttons">
                <button class="difficulty-btn" data-difficulty="easy">Easy</button>
                <button class="difficulty-btn" data-difficulty="medium">Medium</button>
                <button class="difficulty-btn" data-difficulty="hard">Hard</button>
                <button class="difficulty-btn" data-difficulty="zen">Zen</button>
            </div>
            <div class="title-extra-buttons">
                <button id="leaderboard-btn">Leaderboard</button>
            </div>
        </div>
        <div id="game-screen" class="screen">
            <div id="game-container">
                <div id="hourglass-container">
                    <canvas id="hourglass-canvas"></canvas>
                </div>
                <div id="game-board-wrapper">
                    <div id="game-board"></div>
                    <div id="game-overlay"></div>
                    <canvas id="tower-defense-canvas"></canvas>
                </div>
                <div id="combinations-container">
                    <h3>Tower Combinations</h3>
                    <ul id="combinations-list"></ul>
                </div>
            </div>
        </div>
        <div id="game-carousel-wrapper">
            <div id="game-carousel">
                <!-- Carousel items will be generated by JavaScript -->
            </div>
        </div>
    </div>
    <div id="merge-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h2>Merge Games?</h2>
            <p id="merge-warning"></p>
            <p>Select a difficulty for the new merged game:</p>
            <div id="merge-difficulty-buttons" class="difficulty-buttons">
                <button class="difficulty-btn" data-difficulty="easy">Easy</button>
                <button class="difficulty-btn" data-difficulty="medium">Medium</button>
                <button class="difficulty-btn" data-difficulty="hard">Hard</button>
            </div>
            <div class="modal-actions">
                <button id="merge-confirm-btn">Confirm Merge</button>
                <button id="merge-cancel-btn">Cancel</button>
            </div>
        </div>
    </div>
    <div id="game-over-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h2>Game Over!</h2>
            <p>Final Score: <span id="final-score">0</span></p>
            <p>Wave Reached: <span id="final-wave">0</span></p>
            <p>Towers Built: <span id="final-towers">0</span></p>
            <div class="modal-actions">
                <button id="submit-score-btn">Submit Score</button>
                <button id="play-again-btn">Main Menu</button>
            </div>
        </div>
    </div>
    <div id="leaderboard-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h2>Leaderboard</h2>
            <table id="leaderboard-table">
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>Player</th>
                        <th>Score</th>
                        <th>Theme</th>
                        <th>Difficulty</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Leaderboard rows will be inserted here -->
                </tbody>
            </table>
            <div class="modal-actions">
                <button id="close-leaderboard-btn">Close</button>
            </div>
        </div>
    </div>
    <script type="module" src="script.js"></script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516" integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg==" data-cf-beacon='{"version":"2024.11.0","token":"4c6229722a6346bc8eb5cb0e5eae5d41","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
